<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ageing Dashboard</title>
<style>
:root{--bg:#f6f6f4;--surface:#fcfcfb;--line:#e4e3df;--t1:#0b0b0b;--t2:#52514e;--t3:#86857f;--neg:#c0392b;--ok:#008300;--warn:#b26b00;
--b1:#86b6ef;--b2:#5598e7;--b3:#2a78d6;--b4:#1c5cab;--b5:#104281;--b6:#0d366b;--oa:#a3a29c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--surface:#1a1a19;--line:#2e2e2c;--t1:#f0efec;--t2:#c3c2b7;--t3:#8f8e87;--neg:#ff7b6b;--ok:#4cc24c;--warn:#e0a030;
--b1:#184f95;--b2:#1c5cab;--b3:#256abf;--b4:#3987e5;--b5:#6da7ec;--b6:#9ec5f4;--oa:#6b6a65;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--surface:#1a1a19;--line:#2e2e2c;--t1:#f0efec;--t2:#c3c2b7;--t3:#8f8e87;--neg:#ff7b6b;--ok:#4cc24c;--warn:#e0a030;
--b1:#184f95;--b2:#1c5cab;--b3:#256abf;--b4:#3987e5;--b5:#6da7ec;--b6:#9ec5f4;--oa:#6b6a65;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0}.sub{color:var(--t2);margin:2px 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--t1);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button[aria-selected=true]{background:var(--t1);color:var(--surface);border-color:var(--t1)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .l{color:var(--t2);font-size:12px}.tile .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}.tile .d{font-size:12px;color:var(--t3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px}.muted{color:var(--t3);font-size:12px}
.cols{display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:1px solid var(--line);padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col .bar{width:70%;max-width:64px;border-radius:4px 4px 0 0;min-height:1px}
.col .val{font-size:11px;color:var(--t2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.xl{display:flex;gap:10px;margin-top:6px}.xl div{flex:1;text-align:center;font-size:11px;color:var(--t2)}
.hrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.hrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.stack{display:flex;height:14px;gap:2px}.stack span{height:100%}.stack span:last-child{border-radius:0 4px 4px 0}
.hrow .a{font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0;font-size:11px;color:var(--t2)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--t2);font-weight:600;cursor:pointer;position:sticky;top:0;background:var(--surface)}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:200px}td.f{text-align:left;white-space:normal;color:var(--warn);min-width:160px}
.neg{color:var(--neg)}.scroll{overflow:auto;max-height:520px}
input[type=search]{width:100%;max-width:320px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--t1);font:inherit;margin-bottom:8px}
.chk{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--neg);font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--t1);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .1s;z-index:9;max-width:280px}
</style></head><body><div class="wrap">
<h1 id="co"></h1><div class="sub" id="sub"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="view"></div>
</div><div id="tip"></div>
<script>
const DATA=/*__DATA__*/[];
const fmt=v=>{const a=Math.abs(v);const s=a.toLocaleString('en-US',{maximumFractionDigits:0});return v<-0.5?'('+s+')':(a<0.5?'-':s)};
const short=v=>{const a=Math.abs(v),s=a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(0)+'K':a.toFixed(0);return v<0?'('+s+')':s};
const pct=v=>(v*100).toFixed(1)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t){tip.innerHTML=t.dataset.tip;tip.style.opacity=1;tip.style.left=Math.min(e.clientX+12,innerWidth-290)+'px';tip.style.top=(e.clientY+12)+'px'}else tip.style.opacity=0});
const colorFor=(b,i)=>/account/i.test(b)?'var(--oa)':`var(--b${Math.min(i+1,6)})`;
let cur=0,sortK='total',sortD=-1,q='';
function render(){
 const d=DATA[cur],k=d.kpi,B=d.buckets;
 document.getElementById('co').textContent=d.company;
 document.getElementById('sub').textContent=(d.kind==='Debtors'?'Debtor':'Creditor')+' ageing dashboard · as at '+d.asAt;
 const lab=d.kind==='Debtors'?['Gross receivables','Advances from customers']:['Gross payables','Advances to suppliers'];
 const chg=k.prev_gross!=null?`<div class="d">${esc(k.prev_label)}: ${short(k.prev_gross)} · Δ ${short(k.gross-k.prev_gross)}</div>`:`<div class="d">${k.open} parties</div>`;
 const chg90=k.prev_over90!=null?` · ${esc(k.prev_label)} ${short(k.prev_over90)}`:'';
 let h=`<div class="tiles">
 <div class="tile"><div class="l">${lab[0]}</div><div class="v">${short(k.gross)}</div>${chg}</div>
 <div class="tile"><div class="l">Overdue &gt; 90 days</div><div class="v">${short(k.over90)}</div><div class="d">${k.gross?pct(k.over90/k.gross):'-'} of gross${chg90}</div></div>
 <div class="tile"><div class="l">Older than 180 days</div><div class="v">${short(k.over180)}</div><div class="d">${k.gross?pct(k.over180/k.gross):'-'} of gross</div></div>
 <div class="tile"><div class="l">${lab[1]}</div><div class="v">${short(k.advances)}</div><div class="d">${k.opp_count} parties</div></div>
 <div class="tile"><div class="l">Net balance (per Tally)</div><div class="v">${short(k.total)}</div><div class="d">Top 5 = ${pct(k.top5_share)} of gross</div></div></div>`;
 const BP=d.bucketPos,max=Math.max(...BP.map(v=>Math.max(v,0)),1);
 h+=`<div class="grid"><div class="card"><h2>Ageing of ${lab[0].toLowerCase()}</h2><div class="cols">`+BP.map((v,i)=>`<div class="col" data-tip="<b>${esc(B[i])}</b><br>${lab[0]}: ${fmt(v)} (${k.gross?pct(v/k.gross):''})<br>${lab[1]}: ${fmt(d.bucketNeg[i])}<br>Net: ${fmt(d.bucketTotals[i])}"><div class="val">${short(v)}</div><div class="bar" style="height:${Math.max(v,0)/max*85}%;background:${colorFor(B[i],i)}"></div></div>`).join('')+`</div><div class="xl">`+B.map(b=>`<div>${esc(b)}</div>`).join('')+`</div><div class="muted" style="margin-top:8px">Parties with a balance due only; advances are shown separately. Hover a bar for net.</div></div>`;
 const top=d.parties.filter(p=>p.total>0).slice(0,10),tmax=Math.max(...top.map(p=>p.total),1);
 h+=`<div class="card"><h2>Top 10 exposures by ageing</h2>`+top.map(p=>`<div class="hrow"><div class="n" title="${esc(p.name)}">${esc(p.name)}</div><div class="stack" style="width:${p.total/tmax*100}%">`+p.buckets.map((v,i)=>v>0?`<span data-tip="<b>${esc(p.name)}</b><br>${esc(B[i])}: ${fmt(v)}" style="flex:${v};background:${colorFor(B[i],i)}"></span>`:'').join('')+`</div><div class="a">${short(p.total)}</div></div>`).join('')+`<div class="legend">`+B.map((b,i)=>`<span><i style="background:${colorFor(b,i)}"></i>${esc(b)}</span>`).join('')+`</div></div></div>`;
 h+=`<div class="card"><h2>Party-wise ageing</h2><input type="search" id="q" placeholder="Search party or flag…" value="${esc(q)}"><div class="scroll"><table><thead><tr><th data-k="name">Party</th>`+B.map((b,i)=>`<th data-k="b${i}">${esc(b)}</th>`).join('')+`<th data-k="total">Total</th><th data-k="over90">&gt; 90 days</th><th data-k="flags" style="text-align:left">Flags</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
 h+=`<div class="grid">`;
 if(d.movement){h+=`<div class="card"><h2>Largest movements vs ${esc(k.prev_label)}</h2><table><tr><th>Party</th><th>Prior</th><th>Current</th><th>Change</th></tr>`+d.movement.map(m=>`<tr><td>${esc(m.name)} ${m.status?`<span class="muted">· ${m.status}</span>`:''}</td><td>${fmt(m.prev)}</td><td>${fmt(m.curr)}</td><td>${fmt(m.chg)}</td></tr>`).join('')+`</table></div>`}
 h+=`<div class="card"><h2>Reconciliation to Tally</h2>`+d.checks.map(c=>`<div class="chk"><span>${esc(c.name)}</span><span class="${Math.abs(c.diff)<1?'ok':'bad'}">${Math.abs(c.diff)<1?'✓ OK':'✕ '+fmt(c.diff)}</span></div>`).join('')+`</div></div>`;
 document.getElementById('view').innerHTML=h;
 const qi=document.getElementById('q');qi.oninput=()=>{q=qi.value;rows()};
 document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const kk=th.dataset.k;sortD=sortK===kk?-sortD:(kk==='name'||kk==='flags'?1:-1);sortK=kk;rows()});
 rows();
}
function rows(){
 const d=DATA[cur],val=(p,k)=>k[0]==='b'&&k!=='b'?p.buckets[+k.slice(1)]:p[k];
 let ps=d.parties.filter(p=>!q||(p.name+' '+p.flags).toLowerCase().includes(q.toLowerCase()));
 ps.sort((a,b)=>{const x=val(a,sortK),y=val(b,sortK);return (typeof x==='string'?x.localeCompare(y):x-y)*sortD});
 const c=v=>`<td class="${v<-0.5?'neg':''}">${fmt(v)}</td>`;
 document.getElementById('tb').innerHTML=ps.map(p=>`<tr><td>${esc(p.name)}</td>${p.buckets.map(c).join('')}${c(p.total)}${c(p.over90)}<td class="f">${esc(p.flags)}</td></tr>`).join('');
}
const tabs=document.getElementById('tabs');
if(DATA.length>1){tabs.innerHTML=DATA.map((d,i)=>`<button role="tab" aria-selected="${i===0}" data-i="${i}">${d.kind}</button>`).join('');
 tabs.onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.i;tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));render()}}
render();
</script></body></html>
