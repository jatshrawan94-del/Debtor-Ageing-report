<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Tally Ageing Tester</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one column - file intake bar, then KPI row, two-up charts, full-width party table, two-up movement/checks */
:root{--bg:#f6f6f4;--surface:#fcfcfb;--line:#e4e3df;--t1:#0b0b0b;--t2:#52514e;--t3:#86857f;--neg:#c0392b;--ok:#008300;--warn:#9a5c00;--accent:#2a78d6;
--b1:#86b6ef;--b2:#5598e7;--b3:#2a78d6;--b4:#1c5cab;--b5:#104281;--b6:#0d366b;--oa:#a3a29c;--drop:#eef4fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--surface:#1a1a19;--line:#2e2e2c;--t1:#f0efec;--t2:#c3c2b7;--t3:#8f8e87;--neg:#ff7b6b;--ok:#4cc24c;--warn:#e0a030;--accent:#3987e5;
--b1:#184f95;--b2:#1c5cab;--b3:#256abf;--b4:#3987e5;--b5:#6da7ec;--b6:#9ec5f4;--oa:#6b6a65;--drop:#16202c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--surface:#1a1a19;--line:#2e2e2c;--t1:#f0efec;--t2:#c3c2b7;--t3:#8f8e87;--neg:#ff7b6b;--ok:#4cc24c;--warn:#e0a030;--accent:#3987e5;
--b1:#184f95;--b2:#1c5cab;--b3:#256abf;--b4:#3987e5;--b5:#6da7ec;--b6:#9ec5f4;--oa:#6b6a65;--drop:#16202c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;margin:0;text-wrap:balance}.sub{color:var(--t2);margin:2px 0 14px}
.intake{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1.5px dashed var(--accent);background:var(--drop);border-radius:10px;padding:14px;margin-bottom:12px}
.intake.over{border-style:solid}
.intake p{margin:0;flex:1 1 320px;min-width:0;color:var(--t2);font-size:13px}.intake b{color:var(--t1)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loaded{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;color:var(--t2)}.chip.err{color:var(--neg);border-color:var(--neg)}.chip.sample{color:var(--warn)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--t1);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button[aria-selected=true]{background:var(--t1);color:var(--surface);border-color:var(--t1)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .l{color:var(--t2);font-size:12px}.tile .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}.tile .d{font-size:12px;color:var(--t3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px}.muted{color:var(--t3);font-size:12px}
.cols{display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:1px solid var(--line);padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col .bar{width:70%;max-width:64px;border-radius:4px 4px 0 0;min-height:1px}
.col .val{font-size:11px;color:var(--t2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.xl{display:flex;gap:10px;margin-top:6px}.xl div{flex:1;text-align:center;font-size:11px;color:var(--t2);min-width:0}
.hrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.hrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.stack{display:flex;height:14px;gap:2px}.stack span{height:100%}.stack span:last-child{border-radius:0 4px 4px 0}
.hrow .a{font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0;font-size:11px;color:var(--t2)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--t2);font-weight:600;cursor:pointer;position:sticky;top:0;background:var(--surface)}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:200px}td.f{text-align:left;white-space:normal;color:var(--warn);min-width:180px}
.neg{color:var(--neg)}.scroll{overflow:auto;max-height:520px}
input[type=search]{width:100%;max-width:320px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--t1);font:inherit;margin-bottom:8px}
.chk{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--neg);font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--t1);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;opacity:0;z-index:9;max-width:280px}
#msg{font-size:12px;color:var(--t2);margin:-4px 0 12px}
</style>
<div class="wrap">
<h1 id="co">Tally Ageing Tester</h1><div class="sub" id="sub"></div>
<div class="intake" id="drop">
 <p><b>Drop Tally ageing exports here</b> (Group Outstandings, F6 age-wise, .xlsx). Add debtors and creditors together. Add last month's file of the same type too, and the earlier month becomes the comparison. Files are read in your browser and are not uploaded.</p>
 <label class="btn" for="pick">Choose files</label><input id="pick" type="file" accept=".xlsx,.xls" multiple hidden>
 <button class="btn ghost" id="reset" type="button">Reload sample</button>
 <button class="btn ghost" id="dl" type="button" hidden>Download Excel</button>
</div>
<div class="loaded" id="loaded"></div><div id="msg"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="view"></div>

const IMM=1;
const fmt=v=>{const a=Math.abs(v);const s=a.toLocaleString('en-US',{maximumFractionDigits:0});return v<-0.5?'('+s+')':(a<0.5?'-':s)};
const short=v=>{const a=Math.abs(v),s=a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(0)+'K':a.toFixed(0);return v<-0.5?'('+s+')':s};
const pct=v=>(v*100).toFixed(1)+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{if(v==null||v==='')return 0;if(typeof v==='number')return v;let s=String(v).replace(/,/g,'').trim();const n=/^\(.*\)$/.test(s);s=s.replace(/[^0-9.\-]/g,'');const x=parseFloat(s)||0;return n?-x:x};
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function periodEnd(t){const m=/to\s+(\d{1,2})-([A-Za-z]{3})-(\d{2,4})/.exec(t||'');if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,MON[m[2].toLowerCase()],+m[1])}
const monLab=d=>d?d.toLocaleDateString('en-GB',{month:'short'})+'-'+String(d.getFullYear()).slice(2):'Prior';

// ---------- parse one Tally export
function parse(buf,file){
 const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
 const R=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
 const hdr=R.findIndex(r=>String(r[0]??'').trim().toLowerCase()==='particulars');
 if(hdr<0)throw new Error('No "Particulars" header row. Export the report age-wise (F6) from Tally.');
 const pre=R.slice(0,hdr).map(r=>String(r[0]??'').trim());
 const kind=pre.some(p=>/creditor/i.test(p))?'Creditors':'Debtors';
 const period=pre.find(p=>/\d{1,2}-[A-Za-z]{3}-\d{2}/.test(p))||'';
 const asAt=periodEnd(period)||periodEnd(String(R[hdr][1]??''));
 const blab=R[hdr+1]||[],drcr=R[hdr+2]||[],W=Math.max(...R.map(r=>r.length));
 const pairs=[];
 for(let c=1;c<W;c++){if(blab[c]!=null&&/^debit/i.test(String(drcr[c]??''))){pairs.push([String(blab[c]).replace(/[()\s]+/g,' ').trim(),c,/^credit/i.test(String(drcr[c+1]??''))?c+1:null])}}
 if(!pairs.length)throw new Error('No Debit/Credit bucket columns under "Particulars".');
 let tp=pairs[0],bp=pairs.slice(1);if(!/pending/i.test(tp[0])){tp=null;bp=pairs}
 const sg=kind==='Debtors'?1:-1,net=(r,p)=>sg*(num(r[p[1]])-(p[2]!=null?num(r[p[2]]):0));
 let rows=[],grand=null;
 for(const r of R.slice(hdr+3)){const name=String(r[0]??'').trim();if(!name)continue;
  if(/^grand total/i.test(name)){grand={total:tp?net(r,tp):null,buckets:bp.map(p=>net(r,p))};break}
  const b=bp.map(p=>net(r,p));rows.push({name,buckets:b,total:tp?net(r,tp):b.reduce((a,x)=>a+x,0)})}
 // sub-group subtotal rows: only searched when ledgers don't already add up to Grand Total
 const sumT=a=>a.reduce((s,p)=>s+p.total,0);let groups=[];
 if(grand&&grand.total!=null&&Math.abs(sumT(rows)-grand.total)>=1){
  const keep=[];let cur='Sundry '+kind,until=-1;
  for(let i=0;i<rows.length;i++){const r=rows[i];
   if(i>until&&Math.abs(r.total)>=IMM){let acc=r.buckets.map(()=>0),at=0;
    for(let j=i+1;j<rows.length;j++){rows[j].buckets.forEach((v,k)=>acc[k]+=v);at+=rows[j].total;
     if(Math.abs(at-r.total)<0.05&&acc.every((v,k)=>Math.abs(v-r.buckets[k])<0.05)){cur=r.name;groups.push(r.name);until=j;break}}
    if(groups[groups.length-1]===r.name&&until>i)continue}
   r.group=i<=until?cur:'Sundry '+kind;keep.push(r)}
  rows=keep}
 rows.forEach(r=>{r.group=r.group||'Sundry '+kind});
 return {file,company:String(R[0]?.[0]??'').trim(),kind,period,asAt,buckets:bp.map(p=>p[0]),parties:rows,groups,grand};
}
// ---------- analyse
function analyse(d,prev){
 const B=d.buckets,n=B.length,oa=B.findIndex(b=>/account/i.test(b));
 const aged=B.map((_,i)=>i).filter(i=>i!==oa),fo=aged.slice(1),o180=aged.filter(i=>/180|365/.test(B[i]));
 for(const p of d.parties){
  p.material=Math.abs(p.total)>=IMM||p.buckets.some(x=>Math.abs(x)>=IMM);
  p.over90=fo.reduce((s,i)=>s+p.buckets[i],0);p.over180=o180.reduce((s,i)=>s+p.buckets[i],0);p.opp=p.total<-IMM;
  const f=[];if(p.opp)f.push('Advance / opposite balance');
  if(p.total>=IMM&&p.over180/p.total>0.5)f.push('>50% older than 180 days');
  if(/provision|ecl|doubtful/i.test(p.name))f.push('Provision ledger - review classification');
  if(/\b(USD|EUR|GBP)\b/.test(p.name))f.push('Foreign-currency ledger');
  if(p.buckets.some(x=>x<-IMM)&&p.buckets.some(x=>x>IMM))f.push('Unadjusted Dr & Cr in different buckets - knock off bill-wise');
  if(!p.material)f.push('Immaterial / rounding balance');p.flags=f.join('; ')}
 const mat=d.parties.filter(p=>p.material),pos=mat.filter(p=>p.total>0).sort((a,b)=>b.total-a.total),neg=mat.filter(p=>p.opp);
 const col=(ps,i)=>ps.reduce((s,p)=>s+p.buckets[i],0);
 d.bucketTotals=B.map((_,i)=>col(d.parties,i));d.bucketPos=B.map((_,i)=>col(pos,i));d.bucketNeg=B.map((_,i)=>col(neg,i));
 const tot=d.parties.reduce((s,p)=>s+p.total,0),gross=pos.reduce((s,p)=>s+p.total,0);
 d.kpi={total:tot,gross,advances:neg.reduce((s,p)=>s+p.total,0),over90:fo.reduce((s,i)=>s+d.bucketPos[i],0),over180:o180.reduce((s,i)=>s+d.bucketPos[i],0),
  parties:mat.length,open:pos.length,opp_count:neg.length,top5_share:gross?pos.slice(0,5).reduce((s,p)=>s+p.total,0)/gross:0};
 d.checks=[];if(d.grand){if(d.grand.total!=null)d.checks.push({name:'Ledger total = Tally Grand Total',diff:tot-d.grand.total});
  B.forEach((b,i)=>d.checks.push({name:`Bucket '${b}' = Tally Grand Total`,diff:d.bucketTotals[i]-d.grand.buckets[i]}))}
 else d.checks.push({name:'Grand Total row found',diff:1e9});
 d.checks.push({name:'Sum of buckets = Pending Bills',diff:d.bucketTotals.reduce((a,x)=>a+x,0)-tot});
 d.movement=null;
 if(prev){const pm=new Map(prev.parties.map(p=>[p.name,p])),cm=new Map(d.parties.map(p=>[p.name,p]));
  d.movement=[...new Set([...cm.keys(),...pm.keys()])].map(nm=>{const a=cm.get(nm)?.total||0,b=pm.get(nm)?.total||0;
   return {name:nm,prev:b,curr:a,chg:a-b,status:Math.abs(b)<IMM?'New':Math.abs(a)<IMM?'Cleared':''}}).filter(m=>Math.abs(m.prev)>=IMM||Math.abs(m.curr)>=IMM).sort((x,y)=>Math.abs(y.chg)-Math.abs(x.chg));
  Object.assign(d.kpi,{prev_total:prev.kpi.total,prev_gross:prev.kpi.gross,prev_over90:prev.kpi.over90,prev_label:monLab(prev.asAt)})}
 d.list=mat.sort((a,b)=>b.total-a.total);return d;
}
// ---------- state
let FILES=[],REPORTS=[],cur=0,sortK='total',sortD=-1,q='',isSample=true;
function build(){
 const byKind={};FILES.filter(f=>!f.error).forEach(f=>(byKind[f.kind]=byKind[f.kind]||[]).push(f));
 REPORTS=[];
 for(const k of ['Debtors','Creditors']){const fs=(byKind[k]||[]).sort((a,b)=>(a.asAt||0)-(b.asAt||0));if(!fs.length)continue;
  const c=fs[fs.length-1],p=fs.length>1?analyse(structuredClone(fs[fs.length-2])):null;
  REPORTS.push(analyse(structuredClone(c),p))}
 cur=Math.min(cur,Math.max(REPORTS.length-1,0));
 document.getElementById('loaded').innerHTML=FILES.map(f=>f.error?`<span class="chip err">${esc(f.file)}: ${esc(f.error)}</span>`:
  `<span class="chip ${isSample?'sample':''}">${isSample?'Sample · ':''}${esc(f.file)} · ${f.kind} · ${f.asAt?f.asAt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'no date'}</span>`).join('');
 const tabs=document.getElementById('tabs');
 tabs.innerHTML=REPORTS.length>1?REPORTS.map((d,i)=>`<button role="tab" aria-selected="${i===cur}" data-i="${i}">${d.kind}</button>`).join(''):'';
 render();
}
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t){tip.innerHTML=t.dataset.tip;tip.style.opacity=1;tip.style.left=Math.min(e.clientX+12,innerWidth-290)+'px';tip.style.top=(e.clientY+12)+'px'}else tip.style.opacity=0});
const colorFor=(b,i)=>/account/i.test(b)?'var(--oa)':`var(--b${Math.min(i+1,6)})`;
function render(){
 const V=document.getElementById('view');
 if(!REPORTS.length){V.innerHTML='<div class="card"><h2>No readable report yet</h2><div class="muted">Drop a Tally Group Outstandings export above.</div></div>';return}
 const d=REPORTS[cur],k=d.kpi,B=d.buckets;
 document.getElementById('co').textContent=d.company||'Tally Ageing Tester';
 document.getElementById('sub').textContent=(d.kind==='Debtors'?'Debtor':'Creditor')+' ageing · as at '+(d.asAt?d.asAt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):d.period);
 const lab=d.kind==='Debtors'?['Gross receivables','Advances from customers']:['Gross payables','Advances to suppliers'];
 const chg=k.prev_gross!=null?`<div class="d">${esc(k.prev_label)}: ${short(k.prev_gross)} · change ${short(k.gross-k.prev_gross)}</div>`:`<div class="d">${k.open} parties</div>`;
 const chg90=k.prev_over90!=null?` · ${esc(k.prev_label)} ${short(k.prev_over90)}`:'';
 let h=`<div class="tiles">
 <div class="tile"><div class="l">${lab[0]}</div><div class="v">${short(k.gross)}</div>${chg}</div>
 <div class="tile"><div class="l">Overdue &gt; 90 days</div><div class="v">${short(k.over90)}</div><div class="d">${k.gross?pct(k.over90/k.gross):'-'} of gross${chg90}</div></div>
 <div class="tile"><div class="l">Older than 180 days</div><div class="v">${short(k.over180)}</div><div class="d">${k.gross?pct(k.over180/k.gross):'-'} of gross</div></div>
 <div class="tile"><div class="l">${lab[1]}</div><div class="v">${short(k.advances)}</div><div class="d">${k.opp_count} parties</div></div>
 <div class="tile"><div class="l">Net balance (per Tally)</div><div class="v">${short(k.total)}</div><div class="d">Top 5 = ${pct(k.top5_share)} of gross</div></div></div>`;
 const BP=d.bucketPos,max=Math.max(...BP.map(v=>Math.max(v,0)),1);
 h+=`<div class="grid"><div class="card"><h2>Ageing of ${lab[0].toLowerCase()}</h2><div class="cols">`+BP.map((v,i)=>`<div class="col" data-tip="<b>${esc(B[i])}</b><br>${lab[0]}: ${fmt(v)} (${k.gross?pct(v/k.gross):''})<br>${lab[1]}: ${fmt(d.bucketNeg[i])}<br>Net: ${fmt(d.bucketTotals[i])}"><div class="val">${short(v)}</div><div class="bar" style="height:${Math.max(v,0)/max*85}%;background:${colorFor(B[i],i)}"></div></div>`).join('')+`</div><div class="xl">`+B.map(b=>`<div>${esc(b)}</div>`).join('')+`</div><div class="muted" style="margin-top:8px">Parties with a balance due only; advances shown separately. Hover a bar for net.</div></div>`;
 const top=d.list.filter(p=>p.total>0).slice(0,10),tmax=Math.max(...top.map(p=>p.total),1);
 h+=`<div class="card"><h2>Top 10 exposures by ageing</h2>`+top.map(p=>`<div class="hrow"><div class="n" title="${esc(p.name)}">${esc(p.name)}</div><div class="stack" style="width:${p.total/tmax*100}%">`+p.buckets.map((v,i)=>v>0?`<span data-tip="<b>${esc(p.name)}</b><br>${esc(B[i])}: ${fmt(v)}" style="flex:${v};background:${colorFor(B[i],i)}"></span>`:'').join('')+`</div><div class="a">${short(p.total)}</div></div>`).join('')+`<div class="legend">`+B.map((b,i)=>`<span><i style="background:${colorFor(b,i)}"></i>${esc(b)}</span>`).join('')+`</div></div></div>`;
 h+=`<div class="card"><h2>Party-wise ageing</h2><input type="search" id="q" placeholder="Search party or flag" value="${esc(q)}"><div class="scroll"><table><thead><tr><th data-k="name">Party</th>`+B.map((b,i)=>`<th data-k="b${i}">${esc(b)}</th>`).join('')+`<th data-k="total">Total</th><th data-k="over90">&gt; 90 days</th><th data-k="flags" style="text-align:left">Flags</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
 h+=`<div class="grid">`;
 if(d.movement)h+=`<div class="card"><h2>Largest movements vs ${esc(k.prev_label)}</h2><table><tr><th>Party</th><th>Prior</th><th>Current</th><th>Change</th></tr>`+d.movement.slice(0,15).map(m=>`<tr><td>${esc(m.name)} ${m.status?`<span class="muted">· ${m.status}</span>`:''}</td><td>${fmt(m.prev)}</td><td>${fmt(m.curr)}</td><td>${fmt(m.chg)}</td></tr>`).join('')+`</table></div>`;
 else h+=`<div class="card"><h2>Month-on-month</h2><div class="muted">Add last month's export of the same type to see movements.</div></div>`;
 h+=`<div class="card"><h2>Reconciliation to Tally</h2>`+d.checks.map(c=>`<div class="chk"><span>${esc(c.name)}</span><span class="${Math.abs(c.diff)<1?'ok':'bad'}">${Math.abs(c.diff)<1?'✓ OK':'✕ '+(Math.abs(c.diff)>=1e9?'missing':fmt(c.diff))}</span></div>`).join('')+(d.groups.length?`<div class="muted" style="margin-top:8px">Sub-group subtotal rows removed: ${esc(d.groups.join(', '))}</div>`:'')+`</div></div>`;
 V.innerHTML=h;
 const qi=document.getElementById('q');qi.oninput=()=>{q=qi.value;rows()};
 V.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const kk=th.dataset.k;sortD=sortK===kk?-sortD:(kk==='name'||kk==='flags'?1:-1);sortK=kk;rows()});
 rows();
}
function rows(){
 const d=REPORTS[cur],val=(p,k)=>/^b\d+$/.test(k)?p.buckets[+k.slice(1)]:p[k];
 const ps=d.list.filter(p=>!q||(p.name+' '+p.flags).toLowerCase().includes(q.toLowerCase()));
 ps.sort((a,b)=>{const x=val(a,sortK),y=val(b,sortK);return (typeof x==='string'?x.localeCompare(y):x-y)*sortD});
 const c=v=>`<td class="${v<-0.5?'neg':''}">${fmt(v)}</td>`;
 document.getElementById('tb').innerHTML=ps.map(p=>`<tr><td>${esc(p.name)}</td>${p.buckets.map(c).join('')}${c(p.total)}${c(p.over90)}<td class="f">${esc(p.flags)}</td></tr>`).join('');
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.i;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));render()};
// ---------- intake
async function load(fileList){
 const out=[];for(const f of fileList){try{out.push(parse(new Uint8Array(await f.arrayBuffer()),f.name))}catch(e){out.push({file:f.name,error:e.message})}}
 if(isSample){FILES=[];isSample=false}
 FILES=FILES.concat(out);document.getElementById('msg').textContent='';build();
}
function loadSample(){const bin=atob(SAMPLE_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 FILES=[parse(u,'Sample_Debtors_Sep-26.xlsx (demo data)')];isSample=true;cur=0;build()}
const drop=document.getElementById('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>load([...e.dataTransfer.files]));
document.getElementById('pick').onchange=e=>{load([...e.target.files]);e.target.value=''};
document.getElementById('reset').onclick=loadSample;
// ---------- Excel download
function workbook(){
 const wb=XLSX.utils.book_new();
 for(const d of REPORTS){const B=d.buckets,k=d.kpi,t=d.kind==='Debtors'?'Debtor':'Creditor',as=d.asAt?d.asAt.toLocaleDateString('en-GB'):d.period;
  const sum=[[d.company],[`${t} ageing - as at ${as}`],[],['Key indicator','Value'],['Gross balance due',k.gross],['Advances',k.advances],['Net (per Tally)',k.total],['Overdue > 90 days',k.over90],['% of gross > 90',k.gross?k.over90/k.gross:0],['Older than 180 days',k.over180],['Top-5 concentration',k.top5_share],[],
   ['Bucket','Balance due','Advances','Net']].concat(B.map((b,i)=>[b,d.bucketPos[i],d.bucketNeg[i],d.bucketTotals[i]]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),`${t} Summary`.slice(0,31));
  const det=[['Party','Group',...B,'Total','Over 90 days','Flags']].concat(d.list.map(p=>[p.name,p.group,...p.buckets.map(v=>Math.round(v*100)/100),Math.round(p.total*100)/100,Math.round(p.over90*100)/100,p.flags]));
  const ws=XLSX.utils.aoa_to_sheet(det);ws['!cols']=[{wch:46},{wch:22},...B.map(()=>({wch:15})),{wch:15},{wch:15},{wch:50}];
  XLSX.utils.book_append_sheet(wb,ws,`${t} Detail`.slice(0,31));
  if(d.movement)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Party','Prior','Current','Change','Status']].concat(d.movement.map(m=>[m.name,m.prev,m.curr,m.chg,m.status]))),`${t} Movement`.slice(0,31));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Check','Difference','Result']].concat(d.checks.map(c=>[c.name,c.diff,Math.abs(c.diff)<1?'OK':'DIFFERENCE']))),`${t} Checks`.slice(0,31))}
 return XLSX.write(wb,{type:'array',bookType:'xlsx'});
}
(async()=>{if(!window.claude){const b=document.getElementById('dl');b.hidden=false;b.onclick=()=>{if(!REPORTS.length)return;const tag=REPORTS[0].asAt?monLab(REPORTS[0].asAt):'period';const blob=new Blob([workbook()]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ageing_Report_'+tag+'.xlsx';a.click()};return}const dl=await window.claude?.use?.('downloads');if(!dl)return;const b=document.getElementById('dl');b.hidden=false;
 b.onclick=async()=>{if(!REPORTS.length)return;const m=document.getElementById('msg');const tag=REPORTS[0].asAt?monLab(REPORTS[0].asAt):'period';
  try{await dl.save({filename:`Ageing_Report_${tag}.xlsx`,data:workbook()});m.textContent='Excel saved.'}
  catch(e){m.textContent=e.code==='declined'?'Download cancelled.':'Download is not available here.'}}})();
if(window.XLSX)loadSample();else document.getElementById('view').innerHTML='<div class="card"><h2>Spreadsheet reader did not load</h2><div class="muted">Reload the page to try again.</div></div>';
</script>
